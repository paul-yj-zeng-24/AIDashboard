[project]
name = "aidashboard"
version = "0.2.0"
description = "Personal AI dashboard: an agent over calendar, Gmail, Notion and weather"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
]

# Tools only needed while developing (`uv sync` installs them by default).
[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can `import app`
