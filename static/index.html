<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Dashboard</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --me:#1c1917; --me-fg:#fafaf9; --ai:#f0efed; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161514; --fg:#e7e5e4; --muted:#a8a29e; --line:#2e2b29; --me:#e7e5e4; --me-fg:#161514; --ai:#242220; }
  }
  * { box-sizing: border-box; }
  body { margin:0; height:100dvh; display:flex; flex-direction:column; background:var(--bg); color:var(--fg);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); font-weight:600; }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px;
         max-width:760px; width:100%; margin:0 auto; }
  .msg { max-width:80%; padding:9px 13px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--me); color:var(--me-fg); }
  .assistant { align-self:flex-start; background:var(--ai); }
  .error { align-self:center; color:#dc2626; font-size:13px; }
  form { display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--line);
         max-width:760px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
             background:transparent; color:inherit; font:inherit; }
  button { padding:0 18px; border:0; border-radius:10px; background:var(--me); color:var(--me-fg);
           font:inherit; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body>
<header>AI Dashboard</header>
<div id="log"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="Message…" autofocus></textarea>
  <button id="send">Send</button>
</form>

<script>
  // ---------------------------------------------------------------------
  // The front-end. Its only jobs: keep the conversation, send it to the
  // server, and display replies. All AI logic is on the server.
  // ---------------------------------------------------------------------

  // The whole conversation lives here, as [{role, content}, ...]. The server
  // remembers nothing, so we send this entire array with every message.
  // Refreshing the page resets it (that's why the chat clears).
  const history = [];

  // Grab the page elements we'll work with (defined in the HTML above).
  const log = document.getElementById("log");      // the message list
  const input = document.getElementById("input");  // the text box
  const send = document.getElementById("send");    // the Send button

  // Add one chat bubble to the page and return it (so we can update it later).
  // `role` doubles as the CSS class: "user", "assistant" or "error".
  function show(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;   // textContent (not innerHTML) so text is never run as HTML
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;   // scroll to the newest message
    return div;
  }

  // Runs when you press Enter or click Send.
  // `async` lets us `await` the server's reply without freezing the page.
  async function submit() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    send.disabled = true;   // block double-sends while waiting

    // Show your message right away, plus a "…" placeholder for the reply.
    history.push({ role: "user", content: text });
    show("user", text);
    const pending = show("assistant", "…");

    try {
      // Send the whole conversation to server.py's /api/chat endpoint.
      // The server answers with {"reply": "..."} or, on failure, {"error": "..."}.
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);   // jump to catch below

      // Success: replace "…" with the reply and remember it for next turn.
      pending.textContent = data.reply;
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      pending.remove();
      history.pop(); // drop the unanswered message so you can retry
      show("error", "Error: " + err.message);
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  // Wire up the controls. preventDefault() stops the browser's default form
  // behaviour (reloading the page). Enter sends; Shift+Enter adds a new line;
  // isComposing skips Enter presses that confirm Chinese/Japanese IME input.
  document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); submit(); });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  });
</script>
</body>
</html>
